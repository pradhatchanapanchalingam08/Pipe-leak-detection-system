# =========================================================
# Application
# =========================================================
spring.application.name=pipe-leak-detection-system
server.port=8080

# =========================================================
# MySQL Database Configuration
# ---------------------------------------------------------
# CHANGE THESE THREE VALUES to match your local MySQL setup.
# The database "pipe_utility_db" will be created automatically
# because of "createDatabaseIfNotExist=true" in the URL below.
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/pipe_utility_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / Hibernate Configuration
# =========================================================
# Automatically creates / updates tables based on the JPA entities.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# =========================================================
# Jackson (JSON) Configuration
# =========================================================
spring.jackson.serialization.write-dates-as-timestamps=false
